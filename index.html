
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EUM YouTube Display</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.player {
    width: 100vw;
    height: 100vh;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<div class="player">
    <iframe
        src="https://www.youtube.com/embed/1VoA0qpXwTM?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&enablejsapi=1"
        title="EUM YouTube Display"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        allowfullscreen>
    </iframe>
</div>

</body>
</html>
